name: Release

on:
  workflow_dispatch:

jobs:
  build-and-package:
    name: Package (${{ matrix.name }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            runs-on: windows-latest
            target: x86_64-pc-windows-msvc
            alias: windows-x64
            archive: veyra-launcher-windows-x64.zip
          - name: windows-arm64
            runs-on: windows-11-arm
            target: aarch64-pc-windows-msvc
            alias: windows-arm64
            archive: veyra-launcher-windows-arm64.zip
          - name: linux-x64
            runs-on: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            alias: linux-x64
            archive: veyra-launcher-linux-x64.tar.gz
          - name: linux-arm64
            runs-on: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            alias: linux-arm64
            archive: veyra-launcher-linux-arm64.tar.gz
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Package release artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-release.ps1 -Targets ${{ matrix.alias }}
      - name: Package release artifact
        if: runner.os == 'Linux'
        run: bash scripts/package-release.sh ${{ matrix.alias }}
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/${{ matrix.archive }}
            dist/${{ matrix.archive }}.sha256
