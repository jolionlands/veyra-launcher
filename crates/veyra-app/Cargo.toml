[package]
name = "veyra-app"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { workspace = true }
global-hotkey = "0.8"
toml_edit = "0.22"
veyra-core = { path = "../veyra-core" }
veyra-platform = { path = "../veyra-platform" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
